server:
  port: 8082

internal:
  api:
    token: ${USER_SERVICE_API_TOKEN}

spring:
  application:
    name: user-service

  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5434/user_db}
    username: ${USER_DB_USERNAME:user_service}
    password: ${USER_DB_PASSWORD:user_service_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/helpdesk-realm}