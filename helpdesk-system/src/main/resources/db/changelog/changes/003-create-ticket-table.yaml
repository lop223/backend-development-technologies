databaseChangeLog:
  - changeSet:
      id: 003-create-ticket-table
      author: lop223
      changes:
        - createTable:
            tableName: ticket
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(2000)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: assigned_to
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: ticket
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_ticket_category

        - addForeignKeyConstraint:
            baseTableName: ticket
            baseColumnNames: created_by
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_ticket_created_by

        - addForeignKeyConstraint:
            baseTableName: ticket
            baseColumnNames: assigned_to
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_ticket_assigned_to