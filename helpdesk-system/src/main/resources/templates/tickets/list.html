<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заявки</title>
</head>
<body>
<h1>Заявки</h1>
<p><a th:href="@{/}">← На головну</a> | <a th:href="@{/ui/tickets/new}">+ Нова заявка</a></p>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>ID</th>
        <th>Заголовок</th>
        <th>Категорія</th>
        <th>Пріоритет</th>
        <th>Статус</th>
        <th>Створив</th>
        <th>Виконавець</th>
        <th>Дії</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ticket : ${tickets}">
        <td th:text="${ticket.id}"></td>
        <td th:text="${ticket.title}"></td>
        <td th:text="${ticket.categoryName}"></td>
        <td th:text="${ticket.priority}"></td>
        <td th:text="${ticket.status}"></td>
        <td th:text="${ticket.createdByUsername}"></td>
        <td th:text="${ticket.assignedToUsername}"></td>
        <td>
            <form th:action="@{/ui/tickets/{id}/status(id=${ticket.id})}" method="post" style="display:inline">
                <select name="status">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                            th:selected="${s == ticket.status}"></option>
                </select>
                <button type="submit">Змінити статус</button>
            </form>
            <form th:action="@{/ui/tickets/{id}/delete(id=${ticket.id})}" method="post" style="display:inline">
                <button type="submit" onclick="return confirm('Видалити заявку?')">Видалити</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
